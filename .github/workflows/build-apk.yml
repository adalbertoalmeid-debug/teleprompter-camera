name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Copiar a página para o projeto Android
        run: npx cap sync android

      - name: Preparar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o segredo KEYSTORE_BASE64. Veja o README.md, seção 'Assinatura'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/teleprompter.keystore"
          echo "TP_KEYSTORE_FILE=$RUNNER_TEMP/teleprompter.keystore" >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: android
        env:
          TP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/TeleprompterCamera-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TeleprompterCamera-1.0.${{ github.run_number }}
          path: ${{ runner.temp }}/TeleprompterCamera-1.0.${{ github.run_number }}.apk
          if-no-files-found: error
